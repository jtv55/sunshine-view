<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>Sunshine</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="lock">
  <div class="card">
    <div class="brand" style="font-size:20px">Sunshine</div>
    <p class="muted" style="margin:6px 0 0">Enter your passphrase to decrypt your data. Decryption happens in this browser only.</p>
    <form id="f"><input id="pw" type="password" placeholder="Passphrase" autocomplete="current-password" aria-label="Passphrase" autofocus><button class="primary">Unlock</button></form>
    <div class="err" id="err" role="alert"></div>
  </div>
</div>

<div id="app" hidden>
  <header class="top"><div class="in">
    <span class="brand">Sunshine</span>
    <nav aria-label="Pages">
      <a href="#weekly" data-p="weekly">Weekly update</a>
      <a href="#trends" data-p="trends">Long-term trends</a>
      <a href="#insights" data-p="insights">Actionable insights</a>
    </nav>
    <div class="tools"><label class="tg" title="Include paydowns to cards that have no itemised history as one lump of spending"><input type="checkbox" id="lumps"> Count card paydowns without detail</label><span id="asof"></span><button class="ghost" id="theme" title="Toggle light/dark">Theme</button><button class="ghost" id="lockbtn">Lock</button></div>
  </div></header>
  <main id="page"></main>
</div>

<script src="echarts.min.js"></script>
<script src="core.js"></script>
<script src="pages.js"></script>
</body>
</html>
